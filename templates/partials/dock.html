{# The Dock: the fixed row of links to Instagram, TikTok and the contact email.
   Its three values live in config.toml under [extra.dock]. #}
<nav class="dock" aria-label="Dock">
  <ul class="dock__list">
    <li>
      <a class="dock__link" href="{{ config.extra.dock.instagram }}" rel="me noopener" aria-label="Edouard the Ginger on Instagram">
        <svg class="dock__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.3" fill="currentColor"/></svg>
      </a>
    </li>
    <li>
      <a class="dock__link" href="{{ config.extra.dock.tiktok }}" rel="me noopener" aria-label="Edouard the Ginger on TikTok">
        <svg class="dock__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M14 3c.3 2.8 2.2 4.7 5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </a>
    </li>
    <li>
      <a class="dock__link" href="mailto:{{ config.extra.dock.email }}" aria-label="Email Edouard at {{ config.extra.dock.email }}">
        <svg class="dock__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 7.5l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </li>
  </ul>
</nav>
