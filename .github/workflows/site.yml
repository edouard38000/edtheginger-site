name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the versions named in the README.
  ZOLA_VERSION: "0.23.6"
  ZOLA_SHA256: "7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f"
  JUST_VERSION: "1.59.0"
  JUST_SHA256: "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e"

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zola and just (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          zola="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          just="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfLO "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${zola}"
          curl -sSfLO "https://github.com/casey/just/releases/download/${JUST_VERSION}/${just}"
          echo "${ZOLA_SHA256}  ${zola}" | sha256sum --check
          echo "${JUST_SHA256}  ${just}" | sha256sum --check
          tar -xzf "${zola}" -C "$HOME/.local/bin" zola
          tar -xzf "${just}" -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          zola --version
          just --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Build the site and run the checks
        run: just check

      - name: Upload the built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
